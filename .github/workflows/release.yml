name: Release

# Pushing a tag like v1.0.0 builds a signed APK and attaches it to a GitHub release.
# Required repository secrets:
#   ZBXMON_KEYSTORE_BASE64   base64 of your .jks file   (base64 -w0 release.jks)
#   ZBXMON_KEYSTORE_PASSWORD
#   ZBXMON_KEY_ALIAS
#   ZBXMON_KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -qx "zbxmon.versionName=$V" gradle.properties \
            || { echo "Tag $GITHUB_REF_NAME does not match zbxmon.versionName in gradle.properties"; exit 1; }

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZBXMON_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          ZBXMON_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ZBXMON_KEYSTORE_PASSWORD: ${{ secrets.ZBXMON_KEYSTORE_PASSWORD }}
          ZBXMON_KEY_ALIAS: ${{ secrets.ZBXMON_KEY_ALIAS }}
          ZBXMON_KEY_PASSWORD: ${{ secrets.ZBXMON_KEY_PASSWORD }}
        run: ./gradlew --console=plain assembleRelease

      - name: Name the APK and write its checksum
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/zbxmon-$V.apk"
          (cd dist && sha256sum "zbxmon-$V.apk" > "zbxmon-$V.apk.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
